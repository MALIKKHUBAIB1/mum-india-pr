# Netlify deploy config for the TanStack Start (Nitro) app.
# Nitro "netlify" preset outputs:
#   static files -> dist/  (client assets)
#   SSR function -> .netlify/functions-internal/server
# For local Cloudflare preset, output is .output/public + .output/server
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
